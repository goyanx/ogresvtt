# SLF4J Simple logger configuration for OgresVTT server.
# This file is picked up automatically from the classpath at startup.

# Write logs to a file instead of stderr.
# Path is relative to the process working directory.
org.slf4j.simpleLogger.logFile=logs/ogres.log

# Default log level for all loggers.
org.slf4j.simpleLogger.defaultLogLevel=info

# Suppress noisy framework loggers; keep application and Pedestal output.
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn
org.slf4j.simpleLogger.log.io.pedestal=info
org.slf4j.simpleLogger.log.ogres=info

# Include date/time, thread name, and log level in every line.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=false
org.slf4j.simpleLogger.levelInBrackets=true
